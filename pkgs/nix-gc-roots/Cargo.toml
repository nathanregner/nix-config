[package]
name = "nix-gc-roots"
version = "0.1.0"
edition = "2024"
default-run = "nix-gc-roots"

[dependencies]
anyhow = "1"
arboard = { version = "3.6.1", default-features = false, features = [
  "wayland-data-control",
] }
crossterm = "0.29"
fixedbitset = "0.5.7"
heed = { version = "0.22.1", features = ["serde-json"] }
hex = "0.4.3"
petgraph = "0.8.3"
ratatui = "0.30"
rayon = "1.12.0"
rkyv = { version = "0.8", features = ["bytecheck"] }
rustc-hash = "2.1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tui-treelistview = { version = "0.1", features = ["keymap"] }
zstd = "0.13.3"

[dev-dependencies]
criterion = "0.6"
insta = "1.47.2"
tempfile = "3"

[[bench]]
name = "cache"
harness = false

